name: TA-RRT tests

on:
  push:
    paths:
      - "UxV/Path-Planning/TA-RRT/**"
      - ".github/workflows/ta-rrt-tests.yml"
  pull_request:
    paths:
      - "UxV/Path-Planning/TA-RRT/**"
      - ".github/workflows/ta-rrt-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UxV/Path-Planning/TA-RRT
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: UxV/Path-Planning/TA-RRT/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
