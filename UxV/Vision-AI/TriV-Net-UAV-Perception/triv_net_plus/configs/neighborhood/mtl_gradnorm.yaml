dataset_root: data/neighborhood
output_root: Training_result
height: 384
width: 640
epochs: 100
batch_size: 4
workers: 4
lr: 0.0001
weight_decay: 1.0e-7
lr_step_ratio: 0.25
lr_gamma: 0.4
log_interval: 20
disable_tqdm: false
save_epoch_outputs: false

seg_num_classes: 11
seg_ignore_index: 255
od_num_classes: 3
od_min_box_size: 1
od_box_loss_weight: 5.0

eval_od_metrics: true
eval_od_score_thresh: 0.001
eval_od_nms_thresh: 0.5
eval_od_topk: 100

loss_lambda:
  seg: 1.0
  depth: 1.0
  od: 1.0

model:
  backbone: efficientnetv2-s
  neck: FPN
  fpn_channels: 128
  pretrained: true
  seg_head: deeplabv3plus
  depth_head: fpn_depth
  od_head: yolov8
  od_box_encoding: grid_center_signed_ltrb_v2

model_conf:
  Depth: true
  Seg: true
  od: true

seed: 20260806
deterministic: true
gradient_clip_norm: 5.0

checkpoint:
  metric: stl_retention_geomean
  stl_reference:
    seg_miou: 0.6807571053504944
    depth_abs_rel: 0.14786806956922727
    od_map50_95: 0.22096985153000825

loss_balance:
  mode: gradnorm
  calibration_batches: 100
  gradnorm_alpha: 1.5
  gradnorm_lr: 0.025
  gradnorm_shared_scope: neck_lateral5
