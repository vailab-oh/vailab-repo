dataset_root: data/neighborhood
output_root: Training_result
height: 384
width: 640
epochs: 100
batch_size: 4
workers: 4
lr: 0.0001
weight_decay: 1.0e-7
lr_step_ratio: 0.25
lr_gamma: 0.4
log_interval: 20
disable_tqdm: false
save_epoch_outputs: false

seg_num_classes: 11
seg_ignore_index: 255
od_num_classes: 3
od_min_box_size: 1
od_box_loss_weight: 5.0

loss_lambda:
  seg: 1.0
  depth: 1.0
  od: 1.0

model:
  backbone: efficientnetv2-s
  neck: FPN
  fpn_channels: 128
  pretrained: true
  seg_head: deeplabv3plus

model_conf:
  Depth: false
  Seg: true
  od: false

seed: 20260806
deterministic: true
gradient_clip_norm: 5.0

loss_balance:
  mode: static
