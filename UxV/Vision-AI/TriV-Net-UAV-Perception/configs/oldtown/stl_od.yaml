dataset_root: data/oldtown
output_root: Training_result
height: 384
width: 640
epochs: 100
batch_size: 4
workers: 4
lr: 0.0001
weight_decay: 1.0e-7
lr_step_ratio: 0.25
lr_gamma: 0.4
log_interval: 20
disable_tqdm: false
save_epoch_outputs: false

seg_num_classes: 12
seg_ignore_index: 255
od_num_classes: 5
od_min_box_size: 1
od_box_loss_weight: 5.0

eval_od_metrics: true
eval_od_score_thresh: 0.001
eval_od_nms_thresh: 0.5
eval_od_topk: 100

loss_lambda:
  seg: 1.0
  depth: 1.0
  od: 1.0

model:
  backbone: efficientnetv2-s
  neck: FPN
  fpn_channels: 128
  pretrained: true
  od_head: yolov8
  od_box_encoding: grid_center_signed_ltrb_v2

model_conf:
  Depth: false
  Seg: false
  od: true

seed: 20260806
deterministic: true
gradient_clip_norm: 5.0

loss_balance:
  mode: static
