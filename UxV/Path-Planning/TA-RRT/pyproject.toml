[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ta-rrt"
version = "0.1.0"
description = "Corner-guided adaptive sampling and step sizing for RRT* path planning"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Taegeun Oh", email = "tgoh@du.ac.kr" }]
keywords = [
    "adaptive-sampling",
    "path-planning",
    "robotics",
    "rrt-star",
    "sampling-based-planning",
    "terrain-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Paper = "https://doi.org/10.3390/app15052287"
Repository = "https://github.com/vailab-oh/vailab-repo/tree/main/UxV/Path-Planning/TA-RRT"
Issues = "https://github.com/vailab-oh/vailab-repo/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["matplotlib>=3.7", "pytest>=8", "ruff>=0.8"]

[project.scripts]
ta-rrt = "ta_rrt.__main__:main"

[tool.setuptools.packages.find]
include = ["ta_rrt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
